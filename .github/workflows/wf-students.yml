name: wf-students

on:
  push:
    branches: [master]   # <- cámbialo a [master] si tu rama principal es master
  workflow_dispatch:

env:
  # ====== Ajusta estos valores a tus recursos reales en Azure ======
  ACR_RESOURCE_GROUP: kc-students_group            # RG donde está tu ACR
  AZURE_CONTAINER_REGISTRY: registry1762219187865  # nombre del ACR (sin .azurecr.io)
  CONTAINER_NAME: image-workflow-1762220734058     # repo de imagen dentro del ACR
  CLUSTER_NAME: kc-students                        # nombre del AKS
  CLUSTER_RESOURCE_GROUP: kc-students_group        # RG del AKS
  CLUSTER_RESOURCE_TYPE: Microsoft.ContainerService/managedClusters
  DOCKER_FILE: ./SistemaEstudiantes.API/Dockerfile # ruta al Dockerfile
  BUILD_CONTEXT_PATH: ./                           # contexto de build (raíz del repo)
  NAMESPACE: sample-app-namespace-1762220734102    # simplifica usando 'default'
  ENABLENAMESPACECREATION: "false"                 # pon "true" si quieres crearlo
  AUTH_TYPE: SERVICE_PRINCIPAL                     # OIDC con azure/login (sin secret)

jobs:
  buildImage:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Login a Azure con OIDC (usa tus 3 secrets del repo)
      - name: Azure login
        uses: azure/login@v2.2.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          auth-type: ${{ env.AUTH_TYPE }}

      # Login a ACR (te autentica Docker contra <acr>.azurecr.io)
      - name: Log into ACR
        run: |
          az acr login -n ${{ env.AZURE_CONTAINER_REGISTRY }}

      # Build & Push en el runner (evita ACR Tasks)
      - name: Build and push image to ACR (no ACR Tasks)
        run: |
          docker build -f ${{ env.DOCKER_FILE }} \
            -t ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_NAME }}:${{ github.sha }} \
            ${{ env.BUILD_CONTEXT_PATH }}
          docker push ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_NAME }}:${{ github.sha }}

  deploy:
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    needs: [buildImage]
    steps:
      - uses: actions/checkout@v3

      - name: Azure login
        uses: azure/login@v2.2.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          auth-type: ${{ env.AUTH_TYPE }}

      # kubelogin para auth no interactiva contra AKS
      - name: Set up kubelogin for non-interactive login
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: 'v0.0.25'

      # Contexto del clúster (admin=true para el primer deploy; luego puedes poner false)
      - name: Get K8s context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.CLUSTER_RESOURCE_GROUP }}
          cluster-name: ${{ env.CLUSTER_NAME }}
          admin: 'true'                 # <- cambia a 'false' después del primer despliegue
          use-kubelogin: 'true'
          resource-type: ${{ env.CLUSTER_RESOURCE_TYPE }}

      # (Opcional) Crear namespace si lo habilitas
      - name: Create Namespace
        if: ${{ env.ENABLENAMESPACECREATION == 'true' }}
        run: |
          kubectl get namespace ${{ env.NAMESPACE }} || kubectl create namespace ${{ env.NAMESPACE }}

      # Validar que el namespace exista (si usas 'default', esto siempre pasa)
      - name: Validate Namespace Exists
        run: |
          kubectl get namespace ${{ env.NAMESPACE }}

      # Despliegue de manifests y actualización de la imagen al tag del commit
      - name: Deploys application
        uses: Azure/k8s-deploy@v5
        with:
          action: deploy
          # Lista explícita de manifests (recom.)
          manifests: |
            ./manifests/deployment.yaml
            ./manifests/service.yaml
          images: |
            ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.CONTAINER_NAME }}:${{ github.sha }}
          resource-group: ${{ env.CLUSTER_RESOURCE_GROUP }}
          name: ${{ env.CLUSTER_NAME }}
          private-cluster: false
          namespace: ${{ env.NAMESPACE }}
          resource-type: ${{ env.CLUSTER_RESOURCE_TYPE }}
          annotate-namespace: true
